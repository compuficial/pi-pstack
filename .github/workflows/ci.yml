name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node }} / Pi 1.3.0
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run adapter tests
        run: npm test
      - name: Check generated wrappers
        run: |
          node scripts/build-skills.mjs
          test -z "$(git status --porcelain -- skills)"
      - name: Install Pi host
        run: npm install --prefix "$RUNNER_TEMP/pi-host" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.3.0
      - name: Verify Pi loading
        run: node tests/pi-smoke.mjs "$RUNNER_TEMP/pi-host/node_modules/@earendil-works/pi-coding-agent"
      - name: Inspect package contents
        run: npm pack --dry-run
